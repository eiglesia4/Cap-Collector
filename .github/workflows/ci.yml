# ──────────────────────────────────────────────────────────────────────────────
# CapCollector CI — what must be green to integrate (CAP-11, adapted from Seshet / CCS_MRV).
#
# Triggers: pull_request against main · push to main (a merge can break what no branch broke alone).
#
# Jobs (parallel):
#   secrets    gitleaks over the full history
#   checks     lint (eslint + prettier) · typecheck (tsc per workspace) · catalog:check (TEST.md up to date,
#              every test has a unique [T-<comp>-nnn] ID)
#   test       vitest, all workspaces, coverage ≥ 80 %
#   synth      cdk synth naeva/dev without credentials (T-infra-002/003 guard stays silent with no account)
#   ci-gate    the ONLY check required by branch protection; aggregates the others (skipped counts as success)
#
# Principles:
#   • The CI has no AWS credentials, on purpose (as CCS_MRV): metadata and config files are switched off and
#     the first step fails if any AWS_* secret or CDK_DEFAULT_ACCOUNT arrives with a value.
#   • No Docker: single-language TS workspace, setup-node + npm ci is the whole toolchain (doc/spec/method.md).
#   • concurrency cancels older runs of the same PR; never a push to main.
#   • No CD: `cdk deploy` is Edu's, by hand.
# ──────────────────────────────────────────────────────────────────────────────
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  AWS_EC2_METADATA_DISABLED: 'true'
  AWS_CONFIG_FILE: /dev/null
  AWS_SHARED_CREDENTIALS_FILE: /dev/null
  CDK_DISABLE_VERSION_CHECK: 'true'
  CDK_DISABLE_CLI_TELEMETRY: 'true'

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:v8.21.2 \
            detect --source . --redact --no-banner

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: lint
        run: npm run lint
      - name: typecheck
        run: npm run typecheck
      - name: catalog up to date
        run: npm run catalog:check

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: vitest (all workspaces, coverage ≥ 80 %)
        run: npm test
      - name: coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e "const t=require('./coverage/coverage-summary.json').total;console.log('| metric | % |\n|---|---|');for(const k of ['lines','branches','functions','statements'])console.log('| '+k+' | '+t[k].pct+' |')" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  synth:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: no AWS credentials in CI
        run: |
          leaked=$(env | grep -E '^(AWS_ACCESS_KEY_ID|AWS_SECRET_ACCESS_KEY|AWS_SESSION_TOKEN|AWS_PROFILE|CDK_DEFAULT_ACCOUNT)=.+' | cut -d= -f1 || true)
          if [ -n "$leaked" ]; then echo "::error::AWS credentials present in CI: $leaked"; exit 1; fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: cdk synth naeva/dev
        run: npm run synth

  ci-gate:
    name: ci-gate
    needs: [secrets, checks, test, synth]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate gate
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "Job results: $results"
          for r in $results; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::ci-gate failed: a required job ended in '$r'"; exit 1 ;;
            esac
          done
