# ──────────────────────────────────────────────────────────────────────────────
# CapCollector CI — what must be green to integrate (CAP-11, adapted from Seshet / CCS_MRV).
#
# Triggers: pull_request against main · push to main (a merge can break what no branch broke alone).
#
# Jobs:
#   changes    docs_only=true|false (CAP-91): a PR is docs-only when every changed file is `.md` and none is
#              TEST.md (tools/ci/docs-only.ts, T-infra-048/049); a push to main is never docs-only
#   secrets    gitleaks over the full history (always)
#   checks     lint (eslint + prettier) · typecheck (tsc per workspace) · catalog:check (TEST.md up to date,
#              every test has a unique [T-<comp>-nnn] ID); docs-only PRs: prettier on the changed .md files only
#   test       vitest, all workspaces, coverage ≥ 80 % — skipped on docs-only PRs
#   synth      cdk synth of the fixture target test/dev (infra/test/fixtures/config, CAP-105: real target configs
#              are local) without credentials (T-infra-002/003 guard stays silent with no account) —
#              skipped on docs-only PRs
#   ci-gate    the ONLY check required by branch protection; aggregates the others (skipped counts as success,
#              but a failed or cancelled `changes` fails the gate: a broken detector never skips everything)
#   coverage-badge  push to main only, after a green `test` (CAP-103): writes the README's shields.io endpoint JSON
#              (tools/ci/coverage-badge.ts, T-infra-054/055) to the orphan branch `badges`. Only this job gets
#              `contents: write`; it never touches `main` and is not part of ci-gate (it runs after the merge)
#
# Principles:
#   • The CI has no AWS credentials, on purpose (as CCS_MRV): metadata and config files are switched off and
#     the first step fails if any AWS_* secret or CDK_DEFAULT_ACCOUNT arrives with a value.
#   • No Docker: single-language TS workspace, setup-node + npm ci is the whole toolchain (doc/spec/method.md).
#   • concurrency cancels older runs of the same PR; never a push to main.
#   • No CD: `cdk deploy` is Edu's, by hand.
# ──────────────────────────────────────────────────────────────────────────────
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  AWS_EC2_METADATA_DISABLED: 'true'
  AWS_CONFIG_FILE: /dev/null
  AWS_SHARED_CREDENTIALS_FILE: /dev/null
  CDK_DISABLE_VERSION_CHECK: 'true'
  CDK_DISABLE_CLI_TELEMETRY: 'true'

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.detect.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: detect docs-only PR
        id: detect
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            docs_only=false
          else
            files=$(git diff --name-only "origin/$BASE_REF...HEAD")
            echo "Changed files:"; echo "$files"
            docs_only=$(printf '%s\n' "$files" | node --experimental-strip-types --no-warnings tools/ci/docs-only.ts)
          fi
          case "$docs_only" in true|false) ;; *) echo "::error::unexpected detector output '$docs_only'"; exit 1 ;; esac
          echo "docs_only=$docs_only"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:v8.21.2 \
            detect --source . --redact --no-banner

  checks:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the docs-only prettier step can diff against origin/<base>. Unconditional on purpose:
          # in an expression `cond && 0 || 1` yields 1, because 0 is falsy (CAP-91 review).
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: prettier on the changed Markdown (docs-only PR)
        if: needs.changes.outputs.docs_only == 'true'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git diff --name-only -z --diff-filter=d "origin/$BASE_REF...HEAD" \
            | xargs -0 -r npx prettier --check --no-error-on-unmatched-pattern
      - name: lint
        if: needs.changes.outputs.docs_only != 'true'
        run: npm run lint
      - name: typecheck
        if: needs.changes.outputs.docs_only != 'true'
        run: npm run typecheck
      - name: catalog up to date
        if: needs.changes.outputs.docs_only != 'true'
        run: npm run catalog:check

  test:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: vitest (all workspaces, coverage ≥ 80 %)
        run: npm test
      - name: coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e "const t=require('./coverage/coverage-summary.json').total;console.log('| metric | % |\n|---|---|');for(const k of ['lines','branches','functions','statements'])console.log('| '+k+' | '+t[k].pct+' |')" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  coverage-badge:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    # Runs of successive merges queue instead of racing on the `badges` branch (never cancelled).
    concurrency:
      group: coverage-badge
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: coverage
          path: coverage
      - name: build coverage.json
        run: node --experimental-strip-types --no-warnings tools/ci/coverage-badge.ts coverage/coverage-summary.json > "$RUNNER_TEMP/coverage.json" && cat "$RUNNER_TEMP/coverage.json"
      - name: commit to the badges branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A separate repo in a temp dir: the `badges` branch is orphan and shares no history with main.
          dir="$RUNNER_TEMP/badges"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$remote" badges >/dev/null; then
            git clone --quiet --depth 1 --branch badges "$remote" "$dir"
          else
            git init --quiet "$dir" && git -C "$dir" checkout --quiet --orphan badges
            git -C "$dir" remote add origin "$remote"
          fi
          cp "$RUNNER_TEMP/coverage.json" "$dir/coverage.json"
          cd "$dir"
          git add coverage.json
          if git diff --cached --quiet; then echo "coverage unchanged"; exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit --quiet -m "coverage for ${GITHUB_SHA::7}"
          git push --quiet origin badges

  synth:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: no AWS credentials in CI
        run: |
          leaked=$(env | grep -E '^(AWS_ACCESS_KEY_ID|AWS_SECRET_ACCESS_KEY|AWS_SESSION_TOKEN|AWS_PROFILE|CDK_DEFAULT_ACCOUNT)=.+' | cut -d= -f1 || true)
          if [ -n "$leaked" ]; then echo "::error::AWS credentials present in CI: $leaked"; exit 1; fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: cdk synth test/dev (fixture config)
        run: npm run synth
        env:
          CAP_INSTALLATION: test
          CAP_STAGE: dev
          CAP_CONFIG_DIR: ${{ github.workspace }}/infra/test/fixtures/config

  ci-gate:
    name: ci-gate
    needs: [changes, secrets, checks, test, synth]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate gate
        run: |
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "::error::ci-gate failed: the docs-only detector (changes) ended in '${{ needs.changes.result }}'"
            exit 1
          fi
          echo "docs_only=${{ needs.changes.outputs.docs_only }}"
          results="${{ join(needs.*.result, ' ') }}"
          echo "Job results: $results"
          for r in $results; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::ci-gate failed: a required job ended in '$r'"; exit 1 ;;
            esac
          done
